<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Daması</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div id="board" class="board"></div>

        <div class="side-panel">
            <div class="header">
                <h2>Notasyon</h2>
                <div id="status" class="status-badge">Hamle: Beyaz</div>
            </div>

            <div class="move-history-container">
                <table class="move-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Beyaz</th>
                            <th>Siyah</th>
                        </tr>
                    </thead>
                    <tbody id="moveList"></tbody>
                </table>
            </div>

            <div class="controls">
                <div class="button-group-top">
                    <button id="undoBtn" class="secondary-btn">Geri Al</button>
                    <button id="copyBtn" class="secondary-btn">Notasyonu Kopyala</button>
                </div>
                <button id="resetBtn" class="primary-btn">Yeni Oyun</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
